<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonataPY</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.1/css/font-awesome.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="splash.css">
   
</head>
<body>
    <div class="splash-container">        
        <!-- Logo -->
        <img src="assets/logo.png" alt="App Logo" class="logo logo-glow">
        
        <p class="tagline">
           Real-time AI Music Generator
        </p>
        
        <!-- Loading Bar -->
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
        
        <!-- Welcome Text -->
        <p class="welcome-text">
            Preparing your experience
        </p>

    </div>

    <script>
        function redirectToMain() {
            // Redirect to main page
            window.location.href = 'index.html';
        }

        // Start background transition
        document.body.classList.add('background-transition');

        // Automatically redirect after 6 seconds
        setTimeout(redirectToMain, 6000);

        // Load progress tracking
        let progress = 0;
        const progressInterval = setInterval(() => {
            progress += 1;
            if (progress >= 100) {
                clearInterval(progressInterval);
            }
        }, 60); 
    </script>
</body>
</html>
